<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — BETA_TRACK_21</title><link rel="stylesheet" href="styles.css"><style>body{padding:100px 20px}.admin{max-width:850px;margin:auto}.box{background:#101010;border:1px solid #333;padding:22px;margin:18px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#191919;color:#fff;border:1px solid #444;padding:12px}.tabs button.active{background:#e10b15}.form{display:grid;gap:12px}.form input,.form textarea,.form select{background:#080808;border:1px solid #444;color:#fff;padding:12px}.form textarea{min-height:110px}.form button{background:#e10b15;color:#fff;border:0;padding:14px;font-weight:800}.hidden{display:none}</style></head><body><div class="admin"><a class="brand" href="index.html">BETA<span style="color:#f11">_TRACK_21</span></a><div class="box" id="login"><h2>ADMINISTRATION</h2><form class="form"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Mot de passe"><button>SE CONNECTER</button></form><p id="msg"></p></div><div class="box hidden" id="panel"><h2>TABLEAU DE BORD</h2><div class="tabs"><button data-type="piece">Pièce</button><button data-type="service">Mécanique</button><button data-type="tuto">Tuto</button></div><form class="form" id="contentForm"><input id="title" placeholder="Titre" required><textarea id="description" placeholder="Description"></textarea><input id="price" type="number" step="0.01" placeholder="Prix (€)"><input id="media" type="file" accept="image/*,video/*" required><button>AJOUTER</button></form><p id="status"></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
